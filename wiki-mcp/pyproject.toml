[project]
name = "wiki-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing verification tools for the sw-eng-llm-wiki"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.2",
]

[project.scripts]
wiki-mcp = "wiki_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_mcp"]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest>=8.0",
]
